<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
  <title>Registration</title>
</head>

<body>
  <div class="register-container pt-5">
    <div class="container">
      <h1 class="mb-5"><img src="./images/logo-3.png" alt=""></h1>
      <div class="row">
        <div class="col-6">
          <p class="fw-bold text-white fs-5">Sign up and come in</p>
          <p class="text-white mb-5">The registration process is straightforward, uncomplicated,<br> and
            efficient, allowing users to sign up quickly, easily, and <br> at no cost</p>
          <img class="register-decoration-image" src="./images/register-decoration-image.png" alt="">
        </div>
        <div class="col-6 ">
          <div class="bg-white border-1 border-white rounded-2 p-5 mb-5 w-75 float-end ">
            <p class="text-primary mb-0">Create an account</p>
            <h1 class="fw-bold mb-5">Welcome to ByteSpace</h1>
            <form class="clearfix">
              <div class="mb-3">
                <label for="exampleInputName1" class="form-label">Full Name</label>
                <input type="email" class="form-control" id="exampleInputName1" aria-describedby="emailHelp"
                  placeholder="Jamie Davis">
              </div>
              <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Email</label>
                <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp"
                  placeholder="designer@example.com">
              </div>
              <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">Password</label>
                <input type="password" class="form-control" id="exampleInputPassword1" placeholder="********">
              </div>
              <button type="submit" class="btn btn-design-1 float-end mb-5">Submit</button>
            </form>
            <p class="text-center">Already Have an account ? <a class="text-decoration-none" href="login.html">Login</a>
            </p>
          </div>
        </div>
      </div>
    </div>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
