<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
  <title>Login</title>
</head>

<body>
  <div class="register-container pt-5">
    <div class="container">
      <h1 class="mb-5"><img src="./images/logo-3.png" alt=""></h1>
      <div class="row">
        <div class="col-6">
          <p class="fw-bold text-white fs-5">Sign in with ease</p>
          <p class="text-white mb-5">Experience a seamless and efficient sign-in process that <br>grants you instant
            access to a world of knowledge.</p>
          <img class="register-decoration-image" src="./images/register-decoration-image.png" alt="">
        </div>
        <div class="col-6 ">
          <div class="bg-white border-1 border-white rounded-2 p-5 mb-5 w-75 float-end ">
            <p class="text-primary mb-0">Sign In</p>
            <h1 class="fw-bold mb-5">Welcome Back</h1>
            <form class="clearfix">
              <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Email</label>
                <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp"
                  placeholder="designer@example.com">
              </div>
              <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">Password</label>
                <input type="password" class="form-control" id="exampleInputPassword1" placeholder="********">
              </div>
              <button type="submit" class="btn btn-design-1 float-end mb-5">Sign In</button>
            </form>
            <img src="./images/Auto_Layout_Horizontal.png" class="w-100 mb-5">
            <div class="text-center mb-3">
              <a href="#"><img src="./images/facebook_logo.png" class="m-1" alt="facebook_logo" height="56px"
                  width="56px"></a>
              <a href="#"><img src="./images/google-logo.png" class="m-1" alt="google_logo" height="56px"
                  width="56px"></a>
            </div>
            <p class="text-center"><span class="text-secondary">New User ?</span><a class="text-decoration-none"
                href="register.html"> Create an account</a></p>
          </div>
        </div>
      </div>
    </div>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
